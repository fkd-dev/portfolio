<!-- スクロール到達率 / お問い合わせクリックの追加計測 -->
<script>
  (function () {
    var hits = {};
    [25, 50, 75, 100].forEach(function (m) { hits[m] = false; });
    function onScroll() {
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      if (max <= 0) return;
      var pct = Math.round((h.scrollTop || window.scrollY) / max * 100);
      [25, 50, 75, 100].forEach(function (m) {
        if (!hits[m] && pct >= m) {
          hits[m] = true;
          if (window.gtag) gtag('event', 'scroll_depth', { percent: m });
        }
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a');
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (href.indexOf('docs.google.com/forms') > -1 && window.gtag) {
        gtag('event', 'contact_form_open', { location: a.className || 'link' });
      }
    });
  })();
</script>
